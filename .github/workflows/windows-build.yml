name: Build KeyboardVR for Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack KeyboardVR v2 source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path work | Out-Null
          tar -xf source/KeyboardVR-Windows-SteamVR-v2.zip -C work
          if ($LASTEXITCODE -ne 0) { throw "Failed to unpack v2 source archive." }
          if (-not (Test-Path "work/KeyboardVR/CMakeLists.txt")) { throw "CMakeLists.txt was not found after extraction." }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S work/KeyboardVR -B build -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed." }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }

      - name: Package ready-to-run build
        shell: pwsh
        run: |
          $src = Join-Path $PWD 'work/KeyboardVR'
          $out = Join-Path $PWD 'package/KeyboardVR-v2'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse -Force "$src/dist/*" $out
          Copy-Item -Force "$src/install.ps1" "$out/install.ps1"
          Copy-Item -Force "$src/uninstall.ps1" "$out/uninstall.ps1"
          Copy-Item -Force "$src/run.ps1" "$out/run.ps1"
          Copy-Item -Force "$src/diagnose.ps1" "$out/diagnose.ps1"
          Copy-Item -Force "$src/README.md" "$out/README.md"
          tar -a -c -f package/KeyboardVR-v2-Windows-x64.zip -C package KeyboardVR-v2
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed." }

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardVR-v2-Windows-x64
          path: package/KeyboardVR-v2-Windows-x64.zip
          if-no-files-found: error

      - name: Publish/update v0.2.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Resolve-Path 'package/KeyboardVR-v2-Windows-x64.zip').Path
          gh release view v0.2.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.2.0 "$zip" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v0.2.0 "$zip" --repo $env:GITHUB_REPOSITORY --target "$env:GITHUB_SHA" --title "KeyboardVR v2" --notes "Prebuilt Windows x64 KeyboardVR v2 with SteamVR virtual HMD/controllers, DualSense/gamepad input, mouse/touchpad head control, rig visualizer, and virtual room setup." --latest
          }
