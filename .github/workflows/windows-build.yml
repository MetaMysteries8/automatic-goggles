name: Build KeyboardVR for Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify KeyboardVR v2 source
        shell: pwsh
        run: |
          $part1 = (0..10 | ForEach-Object {
            $n = $_.ToString("00")
            (Get-Content "ci/v2.part1.$n.txt" -Raw).Trim()
          }) -join ''

          $tail = (2..6 | ForEach-Object {
            (Get-Content "ci/v2.part$_.b64" -Raw).Trim()
          }) -join ''

          $encoded = $part1 + $tail
          $zip = "$PWD\KeyboardVR-v2-source.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($encoded))

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "392ddafc189caf079820f7dbb18b05c5dc9ce0915d6a39a069d0a4697ed00fe8"
          Write-Host "Source SHA256: $hash"
          if ($hash -ne $expected) {
            throw "KeyboardVR v2 source checksum mismatch. Expected $expected, got $hash."
          }

          Expand-Archive -Path $zip -DestinationPath "$PWD\v2src" -Force
          if (-not (Test-Path "$PWD\v2src\KeyboardVR\CMakeLists.txt")) {
            throw "KeyboardVR v2 source reconstruction failed."
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S "$PWD\v2src\KeyboardVR" -B "$PWD\v2src\KeyboardVR\build" -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed." }

      - name: Build
        shell: pwsh
        run: |
          cmake --build "$PWD\v2src\KeyboardVR\build" --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }

      - name: Verify binaries
        shell: pwsh
        run: |
          $root = "$PWD\v2src\KeyboardVR"
          $exe = "$root\dist\KeyboardVR.exe"
          $dll = "$root\dist\keyboardvr\bin\win64\driver_keyboardvr.dll"
          if (-not (Test-Path $exe)) { throw "Missing KeyboardVR.exe" }
          if (-not (Test-Path $dll)) { throw "Missing driver_keyboardvr.dll" }
          Write-Host "KeyboardVR.exe:" (Get-Item $exe).Length "bytes"
          Write-Host "driver_keyboardvr.dll:" (Get-Item $dll).Length "bytes"

      - name: Package ready-to-run build
        shell: pwsh
        run: |
          $src = "$PWD\v2src\KeyboardVR"
          $out = "$PWD\package\KeyboardVR-v2"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse -Force "$src\dist\*" $out
          foreach ($file in @("install.ps1","uninstall.ps1","run.ps1","diagnose.ps1","README.md")) {
            Copy-Item "$src\$file" "$out\$file"
          }
          if (Test-Path "$src\scripts") {
            Copy-Item -Recurse "$src\scripts" "$out\scripts"
          }
          Compress-Archive -Path "$out\*" -DestinationPath "$PWD\package\KeyboardVR-v2-Windows-x64.zip" -Force

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardVR-v2-Windows-x64
          path: package/KeyboardVR-v2-Windows-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish/update v0.2.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Resolve-Path 'package/KeyboardVR-v2-Windows-x64.zip').Path
          gh release view v0.2.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.2.0 "$zip" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v0.2.0 "$zip" --repo $env:GITHUB_REPOSITORY --target "$env:GITHUB_SHA" --title "KeyboardVR v2" --notes "Prebuilt Windows x64 KeyboardVR v2 with SteamVR virtual HMD/controllers, DualSense/gamepad input, mouse/touchpad head control, rig visualizer, and virtual room setup." --latest
          }
