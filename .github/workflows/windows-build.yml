name: Build KeyboardVR for Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify KeyboardVR v2 source
        shell: pwsh
        run: |
          $parts = 1..6 | ForEach-Object {
            (Get-Content "ci/v2.part$_.b64" -Raw).Trim()
          }
          $encoded = $parts -join ''
          $zip = "$PWD\KeyboardVR-v2-source.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($encoded))

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = "392ddafc189caf079820f7dbb18b05c5dc9ce0915d6a39a069d0a4697ed00fe8"
          Write-Host "Source SHA256: $hash"
          if ($hash -ne $expected) {
            throw "KeyboardVR v2 source checksum mismatch. Expected $expected, got $hash."
          }

          Expand-Archive -Path $zip -DestinationPath "$PWD\v2src" -Force
          if (-not (Test-Path "$PWD\v2src\KeyboardVR\CMakeLists.txt")) {
            throw "KeyboardVR v2 source reconstruction failed."
          }

      - name: Dump controller source for walksim development
        shell: pwsh
        run: |
          Get-Content "$PWD\v2src\KeyboardVR\src\controller\main.cpp"


      - name: Apply MSVC compatibility fixes
        shell: pwsh
        run: |
          $controller = "$PWD\v2src\KeyboardVR\src\controller\main.cpp"
          $text = Get-Content $controller -Raw
          $old = 'const int panelW = std::max(100, (client.right - gap * 4) / 3);'
          $new = 'const int panelW = std::max(100, (static_cast<int>(client.right) - gap * 4) / 3);'
          if (-not $text.Contains($old)) { throw "Expected visualizer panel-width line not found." }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($controller, $text)

      - name: Configure
        shell: pwsh
        run: |
          cmake -S "$PWD\v2src\KeyboardVR" -B "$PWD\v2src\KeyboardVR\build" -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed." }

      - name: Build
        shell: pwsh
        run: |
          cmake --build "$PWD\v2src\KeyboardVR\build" --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Build failed." }

      - name: Verify binaries
        shell: pwsh
        run: |
          $root = "$PWD\v2src\KeyboardVR"
          $exe = "$root\dist\KeyboardVR.exe"
          $dll = "$root\dist\keyboardvr\bin\win64\driver_keyboardvr.dll"
          if (-not (Test-Path $exe)) { throw "Missing KeyboardVR.exe" }
          if (-not (Test-Path $dll)) { throw "Missing driver_keyboardvr.dll" }

      - name: Package simple ready-to-run build
        shell: pwsh
        run: |
          $src = "$PWD\v2src\KeyboardVR"
          $out = "$PWD\package\KeyboardVR-v2.1"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # Keep the built EXE and SteamVR driver directly at the top level.
          Copy-Item "$src\dist\KeyboardVR.exe" "$out\KeyboardVR.exe"
          Copy-Item -Recurse "$src\dist\keyboardvr" "$out\keyboardvr"

          $install = @'
          @echo off
          setlocal
          title KeyboardVR Driver Installer

          set "DRIVER=%~dp0keyboardvr"
          if not exist "%DRIVER%\driver.vrdrivermanifest" (
            echo ERROR: keyboardvr driver folder is missing.
            pause
            exit /b 1
          )

          set "VRPATH=%ProgramFiles(x86)%\Steam\steamapps\common\SteamVR\bin\win64\vrpathreg.exe"
          if exist "%VRPATH%" goto found

          for /f "tokens=2,*" %%A in ('reg query "HKCU\Software\Valve\Steam" /v SteamPath 2^>nul ^| find /i "SteamPath"') do set "STEAMPATH=%%B"
          if defined STEAMPATH set "VRPATH=%STEAMPATH%\steamapps\common\SteamVR\bin\win64\vrpathreg.exe"

          :found
          if not exist "%VRPATH%" (
            echo ERROR: Could not find SteamVR's vrpathreg.exe.
            echo Make sure SteamVR is installed, then try again.
            pause
            exit /b 1
          )

          echo Installing KeyboardVR SteamVR driver...
          "%VRPATH%" removedriver "%DRIVER%" >nul 2>nul
          "%VRPATH%" adddriver "%DRIVER%"
          if errorlevel 1 (
            echo.
            echo ERROR: SteamVR driver registration failed.
            pause
            exit /b 1
          )

          echo.
          echo KeyboardVR driver installed.
          echo.
          echo Next:
          echo   1. Run KeyboardVR.exe
          echo   2. Start SteamVR
          echo.
          pause
          '@
          [IO.File]::WriteAllText("$out\Install Driver.bat", $install.Trim(), [Text.Encoding]::ASCII)

          $uninstall = @'
          @echo off
          setlocal
          title KeyboardVR Driver Uninstaller

          set "DRIVER=%~dp0keyboardvr"
          set "VRPATH=%ProgramFiles(x86)%\Steam\steamapps\common\SteamVR\bin\win64\vrpathreg.exe"
          if exist "%VRPATH%" goto found

          for /f "tokens=2,*" %%A in ('reg query "HKCU\Software\Valve\Steam" /v SteamPath 2^>nul ^| find /i "SteamPath"') do set "STEAMPATH=%%B"
          if defined STEAMPATH set "VRPATH=%STEAMPATH%\steamapps\common\SteamVR\bin\win64\vrpathreg.exe"

          :found
          if not exist "%VRPATH%" (
            echo ERROR: Could not find SteamVR's vrpathreg.exe.
            pause
            exit /b 1
          )

          "%VRPATH%" removedriver "%DRIVER%"
          echo.
          echo KeyboardVR driver uninstalled.
          pause
          '@
          [IO.File]::WriteAllText("$out\Uninstall Driver.bat", $uninstall.Trim(), [Text.Encoding]::ASCII)

          $readme = @'
          KeyboardVR - Simple Windows Build

          First setup:
            1. Close SteamVR if it is open.
            2. Double-click "Install Driver.bat".
            3. Double-click KeyboardVR.exe.
            4. Start SteamVR.

          Normal use after installation:
            1. Run KeyboardVR.exe.
            2. Start SteamVR.

          To remove the virtual driver:
            Double-click "Uninstall Driver.bat".

          No PowerShell scripts or build tools are required for this release.
          '@
          [IO.File]::WriteAllText("$out\README.txt", $readme.Trim(), [Text.Encoding]::UTF8)

          Compress-Archive -Path "$out\*" -DestinationPath "$PWD\package\KeyboardVR-v2.1-Windows-x64.zip" -Force

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardVR-v2.1-Windows-x64
          path: package/KeyboardVR-v2.1-Windows-x64.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish/update v0.2.1 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Resolve-Path 'package/KeyboardVR-v2.1-Windows-x64.zip').Path
          gh release view v0.2.1 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.2.1 "$zip" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create v0.2.1 "$zip" --repo $env:GITHUB_REPOSITORY --target "$env:GITHUB_SHA" --title "KeyboardVR v2.1 - Simple Build" --notes "Prebuilt Windows x64 release with the simple workflow restored: install driver, run KeyboardVR.exe, start SteamVR. No PowerShell or local build step required." --latest
          }
